#                     newest stable release from maven.fabricmc.net)
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.19

# Mod Properties
version=0.1.0
maven_group=dev.cassicraft
archives_base_name=cassicraft
mod_id=cassicraft

# Dependencies
fabric_api_version=0.157.0+26.2

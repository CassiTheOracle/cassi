# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache.
org.gradle.configuration-cache=false

# Fabric Properties — check these on https://fabricmc.net/develop
# minecraft_version  = 26.2 (BUILD-PLAN.md §1; current release)
# loader_version     >= 0.18.4 required; pinned 0.19.3 (the template's checked-current)
# loom_version       plan requires Loom 1.15+; pinned stable 1.17.19

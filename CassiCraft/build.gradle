// ----------------------------------------------------------------------------
// Game-source surface-genesis probe (the wave's falsification answered through
// the Q4 write lane): measures whether a bounded, cap-governed genesis
// (SurfaceGenesis — a fixed-count coherence-restoring deposit through
// CassiFieldThread.submitPerturbation) organizes the uniformly-solid sponge
// (SurfaceEmergenceMain's falsification) into a real vertical density body with
// a standable surface, deterministically, seed-sensitively, and honestly (caps
// in range). A measurement probe — reports the verdict (SUPPORTS/CONTRADICTS/
// INCONCLUSIVE with the numbers) but is NOT a gate. Headless, no live server.
// ----------------------------------------------------------------------------
def genesisProbeRun = tasks.register('genesisProbe', JavaExec) {
	group = 'verification'
	description = 'Runs the surface-genesis probe (a bounded Q4-lane deposit vs the no-genesis sponge: does it organize a vertical body?) but is not part of the build gate.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'dev.cassicraft.game.genesis.GenesisProbeMain'
}

// ----------------------------------------------------------------------------
// Game-source surface-genesis determinism + honesty gate (async-field-domain §7
// Q4; wiring-requests/q4-write-lane-design.md): the genesis is a bounded,
// cap-governed deposit through the REAL Q4 write lane. Asserts it is
// deterministic (same seed + same genesis -> identical post-genesis fingerprint
// over measured structure + settled field), seed-sensitive, moved the field vs
// the no-genesis control (anti-vacuity), and stayed within its own caps (the
// matched-φ design expects zero clamps — an unexpected clamp is a design bug).
// Prints the honest verdict (SUPPORTS/CONTRADICTS/INCONCLUSIVE) asserted by the
// measurement. Headless, no live client/server.
// ----------------------------------------------------------------------------
def genesisDeterminismRun = tasks.register('genesisDeterminism', JavaExec) {
	group = 'verification'
	description = 'Runs the surface-genesis determinism + honesty gate (same-seed identical, seed-sensitive, moved the field, caps in range) without a live client.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'dev.cassicraft.game.genesis.GenesisDeterminismMain'
}

check.dependsOn genesisDeterminismRun
build.dependsOn genesisDeterminismRun

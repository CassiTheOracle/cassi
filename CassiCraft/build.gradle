// ----------------------------------------------------------------------------
// Game-source follow-behind advection determinism gate (corpus-map §4;
// world-seams §4.2 anchor-to-window; async-field-domain §7 Q1): the box re-homes
// over a world-fixed field (exact rotation), reversibly, deterministically, with
// a published center that advances by the exact whole-cell delta. Headless.
// ----------------------------------------------------------------------------
def followBehindDeterminismRun = tasks.register('followBehindDeterminism', JavaExec) {
	group = 'verification'
	description = 'Runs the follow-behind advection determinism gate (world-fixedness, reversibility, determinism+sensitivity, center continuity) without a live client.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'dev.cassicraft.game.advect.FollowBehindDeterminismMain'
}

build.dependsOn followBehindDeterminism

// Bundle the `domain` output into the single mod jar. This is plain-Java
// packaging — `domain` still compiles with NO Minecraft on its classpath (the
// seam is compile-time + threading, not runtime classpath physics), and Fabric
// loads it from the flat jar classpath alongside the Minecraft host.
jar {
	from(sourceSets.domain.output)
}

processResources {
	def version = project.version
	inputs.property 'version', version
	inputs.property 'loader_version', project.loader_version
	inputs.property 'minecraft_version', project.minecraft_version
	inputs.property 'mod_id', project.mod_id

	filesMatching('fabric.mod.json') {
		expand 'version': version,
				'loader_version': project.loader_version,
				'minecraft_version': project.minecraft_version,
				'mod_id': project.mod_id
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}


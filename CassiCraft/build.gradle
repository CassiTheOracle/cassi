// seed-sensitively, over the real publish seam. Also reports the field-time
// pacing rate (t reached per wall-clock second). Reads the published snapshot
// only — never writes a block. Headless (the surfaceDiagnostics pattern), no
// live client/server.
// ----------------------------------------------------------------------------
def surfaceEmergenceRun = tasks.register('surfaceEmergence', JavaExec) {
	group = 'verification'
	description = 'Runs the surface-emergence + pacing gate (the paced field organizes a real vertical gradient + a standable coherent plane, deterministically, seed-sensitive) without a live client.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'dev.cassicraft.game.surface.SurfaceEmergenceMain'
	// The paced field-time target (t) to settle to — hardcoded 20 (the t≈10–50
	// range, reachable in ~100 s) rather than a gradle -D property, because a
	// gradle daemon caches stray -D props across invocations and would skew the
	// gate. A calibration run overrides it by editing the program default.
	jvmArgs '-Dsurface.emergence.maxTarget=20', '-Dsurface.emergence.skipDeterminism=false'
}

build.dependsOn surfaceEmergenceRun
check.dependsOn surfaceEmergenceRun


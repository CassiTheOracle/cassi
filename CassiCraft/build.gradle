	group = 'verification'
	description = 'Runs the Phase-1 ride-downhill probe (a cart on the field\'s own river-law haul vs a flat control) without a live client.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'dev.cassicraft.game.road.RideDownhillProbeMain'
}

build.dependsOn rideProbeRun
check.dependsOn rideProbeRun


// (1−q) discharge over a rising-ε² drain), the orbit well (the body-seed
// condensation candidate over a strong ∇(g·Φ)), and the envelope (the
// sub-condensation gas band vs the vacuum ceiling) — are a pure, deterministic
// function of the published channels: same window, same field state → same
// atmosphere, never a seeded roll. Asserts determinism across same-seed
// settles, seed sensitivity, positive-count anti-vacuity (a real discharge
// exists and the sky is not a monochrome discharge), and classifier purity
// (same reading → same verdict, every presented number a channel/registry
// constant). Pure consumer of the publish — never writes a block, never
// perturbs the field. Headless — no live client/server.

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cassi field-intelligence architectural responsibilities</title>
  <desc id="desc">Admitted observations update the durable adaptive field. Queries, goals, and constraints combine with recalled associations and transition operators to refine provisional trajectories. Supported settled plans pass through authorization to action. Acknowledged outcomes return to the persistent update. A separate dashed path connects selected references to exact source bytes and verified evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#b45309"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .label { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .edge { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow-blue); }
      .edge-amber { fill: none; stroke: #b45309; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow-amber); }
      .edge-label { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #475569; text-anchor: middle; paint-order: stroke; stroke: white; stroke-width: 7px; stroke-linejoin: round; }
      .legend { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <text class="title" x="70" y="58">Cassi field-intelligence loop</text>
  <text class="subtitle" x="70" y="91">Durable learning, provisional deliberation, exact evidence, and authorized action have distinct responsibilities.</text>

  <!-- Fixed machinery boundary -->
  <rect x="48" y="125" width="1504" height="660" rx="28" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="12 10"/>
  <rect x="82" y="108" width="390" height="35" rx="17" fill="#e2e8f0"/>
  <text class="small" x="277" y="132">Θ: fixed codecs, operators, validation, and policy</text>

  <!-- Inputs -->
  <g filter="url(#shadow)">
    <rect x="80" y="215" width="255" height="90" rx="18" fill="#eef2f7" stroke="#64748b" stroke-width="2"/>
    <text class="label" x="207" y="251">Admitted</text>
    <text class="label" x="207" y="277">observation</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="80" y="465" width="255" height="104" rx="18" fill="#eef2f7" stroke="#64748b" stroke-width="2"/>
    <text class="label" x="207" y="500">Query, goal,</text>
    <text class="label" x="207" y="526">and constraints</text>
    <text class="small" x="207" y="552">boundary inputs</text>
  </g>

  <!-- Durable state -->
  <g filter="url(#shadow)">
    <rect x="430" y="180" width="325" height="112" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text class="label" x="592" y="220">Persistent update</text>
    <text class="small" x="592" y="249">admit observed evidence</text>
    <text class="small" x="592" y="272">and replace checkpoint</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="430" y="354" width="325" height="118" rx="22" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="4"/>
    <text class="label" x="592" y="393">F: durable adaptive field</text>
    <text class="small" x="592" y="424">associations • learned moments</text>
    <text class="small" x="592" y="449">persistent state lineage</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="430" y="535" width="325" height="112" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text class="label" x="592" y="576">Recall and prediction</text>
    <text class="small" x="592" y="606">addresses • transition operators</text>
    <text class="small" x="592" y="629">support and alternatives</text>
  </g>

  <!-- Evidence -->
  <g filter="url(#shadow)">
    <rect x="850" y="174" width="300" height="126" rx="22" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text class="label" x="1000" y="214">E: exact source bytes</text>
    <text class="small" x="1000" y="245">content-addressed objects</text>
    <text class="small" x="1000" y="271">integrity-verified reconstruction</text>
  </g>

  <!-- Provisional thought -->
  <g filter="url(#shadow)">
    <rect x="850" y="365" width="300" height="126" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text class="label" x="1000" y="405">W: provisional trajectories</text>
    <text class="small" x="1000" y="436">operators • masks • residuals</text>
    <text class="small" x="1000" y="462">competing nonverbal plans</text>
  </g>

  <!-- Decision and action -->
  <g filter="url(#shadow)">
    <path d="M1280 342 L1430 428 L1280 514 L1130 428 Z" fill="#f5f3ff" stroke="#6d28d9" stroke-width="3"/>
    <text class="label" x="1280" y="414">Supported</text>
    <text class="label" x="1280" y="440">and settled?</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1190" y="596" width="250" height="84" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text class="label" x="1315" y="631">Authorization</text>
    <text class="small" x="1315" y="657">policy and authority</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1190" y="718" width="250" height="70" rx="18" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/>
    <text class="label" x="1315" y="762">Action</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="820" y="703" width="300" height="86" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text class="label" x="970" y="738">Acknowledged outcome</text>
    <text class="small" x="970" y="765">eligible for consolidation</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1190" y="198" width="250" height="74" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
    <text class="label" x="1315" y="230">Non-settlement</text>
    <text class="small" x="1315" y="255">support, ambiguity, or budget</text>
  </g>

  <!-- Edges -->
  <path class="edge-blue" d="M335 260 C375 260, 390 236, 430 236"/>
  <path class="edge-blue" d="M592 292 L592 354"/>
  <path class="edge-blue" d="M592 472 L592 535"/>
  <path class="edge" d="M335 517 C375 517, 390 591, 430 591"/>
  <path class="edge" d="M755 591 C805 591, 810 428, 850 428"/>
  <path class="edge-amber" d="M755 566 C835 520, 795 237, 850 237"/>
  <text class="edge-label" x="795" y="387" transform="rotate(-73 795 387)">selected reference; binding incomplete</text>
  <path class="edge-amber" d="M1000 300 L1000 365"/>
  <text class="edge-label" x="1078" y="338">verified evidence</text>
  <path class="edge" d="M1150 428 L1130 428"/>
  <path class="edge" d="M1280 514 L1280 596"/>
  <text class="edge-label" x="1305" y="560">yes</text>
  <path class="edge" d="M1280 342 L1280 272"/>
  <text class="edge-label" x="1305" y="309">no</text>
  <path class="edge" d="M1315 680 L1315 718"/>
  <path class="edge" d="M1190 753 L1120 753"/>
  <path class="edge-blue" d="M820 746 C705 746, 780 236, 755 236"/>
  <text class="edge-label" x="781" y="690" transform="rotate(-82 781 690)">observed feedback</text>

  <!-- Legend -->
  <rect x="80" y="821" width="24" height="24" rx="5" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text class="legend" x="115" y="839">durable adaptive state</text>
  <rect x="335" y="821" width="24" height="24" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="legend" x="370" y="839">provisional deliberation</text>
  <rect x="610" y="821" width="24" height="24" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text class="legend" x="645" y="839">exact evidence</text>
  <rect x="815" y="821" width="24" height="24" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text class="legend" x="850" y="839">authorized world path</text>
  <rect x="1100" y="821" width="24" height="24" rx="5" fill="#eef2f7" stroke="#64748b" stroke-width="2"/>
  <text class="legend" x="1135" y="839">fixed boundary input</text>
  <rect x="1350" y="821" width="24" height="24" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text class="legend" x="1385" y="839">non-settlement</text>
</svg>
